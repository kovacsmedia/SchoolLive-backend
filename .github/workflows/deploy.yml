name: Deploy backend

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # Multi-node: minden pushnál MINDEN cluster-node-ra deployolunk, azonos
    # lépéssorral (a kód mindenhol ugyanaz). A host-lista egy repo Variable-
    # ből jön (Settings → Secrets and variables → Actions → Variables →
    # DEPLOY_HOSTS), JSON tömbként, pl.:
    #   ["api.schoollive.hu","api2.schoollive.hu"]
    # Nem secret, mert a hostname nem érzékeny adat. Az SSH-hitelesítés
    # (DEPLOY_USER/DEPLOY_KEY) egyelőre közös minden node-on – ha egy
    # jövőbeli node más hitelesítést igényel, ez itt később node-onként
    # szétbontható.
    #
    # fail-fast:false – egy node deploy-hibája ne szakítsa meg a többiét.
    # Egyidejű `prisma migrate deploy` N node-ról ugyanarra a DB-re
    # BIZTONSÁGOS: a Prisma Migrate saját Postgres advisory lockot tart a
    # migrációk alkalmazása alatt pontosan erre az esetre (több replika
    # egyszerre deployol) – a második node blokkol, amíg az első végez,
    # utána 0 migrációt talál alkalmazandónak és sikeresen kilép.
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(vars.DEPLOY_HOSTS) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -H "${{ matrix.host }}" >> ~/.ssh/known_hosts

      - name: Upload backend to server (rsync)
        continue-on-error: true
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --ignore-errors --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='dist' --exclude='uploads' --exclude='audio'
          path: ./
          remote_path: /opt/schoollive/backend
          remote_host: ${{ matrix.host }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Install, migrate, build and restart (PM2)
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ matrix.host }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/schoollive/backend

            echo "== Node version =="
            node -v || true
            npm -v || true

            echo "== Fix node_modules permissions =="
            sudo chown -R deploy:deploy /opt/schoollive/backend/node_modules || true

            echo "== Install deps =="
            npm install

            # .env betöltése – MINDEN node .env-jében kötelező (multi-node
            # bevezetése óta): DATABASE_URL (közös, központi Postgres),
            # NODE_HOSTNAME (ennek a node-nak a publikus DNS neve, pl.
            # "api2.schoollive.hu"), és JWT_ACCESS_SECRET-nek AZONOSNAK
            # kell lennie minden node-on (egy node által kiadott tokent
            # bármelyik másiknak érvényesítenie kell tudnia).
            if [ -f ".env" ]; then
              echo "== Loading .env =="
              set -a
              . ./.env
              set +a
            else
              echo "WARNING: .env not found on server!"
            fi

            echo "== Prisma generate =="
            npx prisma generate

            echo "== Prisma migrate deploy =="
            npx prisma migrate deploy

            echo "== Build =="
            npm run build

            echo "== Create audio/upload dirs =="
            mkdir -p /opt/schoollive/backend/audio/bells
            chmod 755 /opt/schoollive/backend/audio/bells
            mkdir -p /opt/schoollive/backend/uploads/radio
            chmod 755 /opt/schoollive/backend/uploads/radio

            echo "== yt-dlp frissítés =="
            /home/deploy/.local/bin/yt-dlp -U || true

            echo "== PM2 start/reload =="
            if pm2 describe schoollive-api >/dev/null 2>&1; then
              pm2 reload schoollive-api
            else
              pm2 start dist/server.js --name schoollive-api
            fi

            echo "== PM2 save =="
            pm2 save
